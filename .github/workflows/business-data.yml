name: Shared business data
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-business-data.mjs --check
      - run: node scripts/sync-discovery.mjs --check
      - run: node --test tests/business-data.test.mjs
      - run: node --test tests/discovery.test.mjs
